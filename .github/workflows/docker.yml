# Builds the Docker image on every push to main and publishes it to GitHub Container Registry,
# so the droplet only has to `docker compose pull` instead of building.
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.env.example', '.idea/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kyanbrix/livestream-bot # GHCR names must be lowercase

jobs:
  publish:
    runs-on: ubuntu-latest # amd64, same as the droplet
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
